name: Test basic usage - coverage outputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            apt-get update -qq
            apt-get install -y wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            dpkg -i packages-microsoft-prod.deb
            apt-get update -qq
            apt-get install -y powershell
          fi
          pwsh --version

      - id: jacoco
        uses: .
        with:
          coverage_results_path: tests/fixtures/jacoco-coverage.xml
          skip_check_run: "true"
          publish_only_summary: "true"
          coverage_report_name: "Test Coverage Report"
          coverage_report_title: "Test Coverage Report Title"

      - name: Assert coverage_percentage is non-empty
        env:
          ACTUAL: ${{ steps.jacoco.outputs.coverage_percentage }}
        run: |
          echo "coverage_percentage: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: coverage_percentage output is empty"
            exit 1
          fi
          echo "PASS: coverage_percentage=$ACTUAL"

      - name: Assert covered_lines is non-empty
        env:
          ACTUAL: ${{ steps.jacoco.outputs.covered_lines }}
        run: |
          echo "covered_lines: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: covered_lines output is empty"
            exit 1
          fi
          echo "PASS: covered_lines=$ACTUAL"

      - name: Assert missed_lines is non-empty
        env:
          ACTUAL: ${{ steps.jacoco.outputs.missed_lines }}
        run: |
          echo "missed_lines: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: missed_lines output is empty"
            exit 1
          fi
          echo "PASS: missed_lines=$ACTUAL"

      - name: Assert total_lines is non-empty
        env:
          ACTUAL: ${{ steps.jacoco.outputs.total_lines }}
        run: |
          echo "total_lines: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: total_lines output is empty"
            exit 1
          fi
          echo "PASS: total_lines=$ACTUAL"

      - name: Assert total_lines equals covered + missed
        env:
          COVERED: ${{ steps.jacoco.outputs.covered_lines }}
          MISSED: ${{ steps.jacoco.outputs.missed_lines }}
          TOTAL: ${{ steps.jacoco.outputs.total_lines }}
        run: |
          echo "covered=$COVERED missed=$MISSED total=$TOTAL"
          EXPECTED=$(( COVERED + MISSED ))
          if [ "$EXPECTED" != "$TOTAL" ]; then
            echo "FAIL: covered($COVERED) + missed($MISSED) = $EXPECTED != total($TOTAL)"
            exit 1
          fi
          echo "PASS: total_lines arithmetic checks out"
