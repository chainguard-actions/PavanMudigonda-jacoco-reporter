name: Test minimum coverage - threshold not met (fail)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            apt-get update -qq
            apt-get install -y wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            dpkg -i packages-microsoft-prod.deb
            apt-get update -qq
            apt-get install -y powershell
          fi
          pwsh --version

      # Use 90% coverage fixture with 100% minimum threshold — should fail
      - id: jacoco
        uses: .
        continue-on-error: true
        with:
          coverage_results_path: tests/fixtures/jacoco-coverage.xml
          minimum_coverage: "100"
          fail_below_threshold: "true"
          skip_check_run: "true"
          publish_only_summary: "true"

      - name: Assert action failed due to coverage below threshold
        env:
          OUTCOME: ${{ steps.jacoco.outcome }}
          COVERAGE: ${{ steps.jacoco.outputs.coverage_percentage }}
        run: |
          echo "outcome: $OUTCOME"
          echo "coverage_percentage: $COVERAGE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when coverage is below minimum threshold, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when coverage was below minimum threshold"
