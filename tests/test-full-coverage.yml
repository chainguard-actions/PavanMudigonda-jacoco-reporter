name: Test full coverage - 100% coverage scenario
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            apt-get update -qq
            apt-get install -y wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            dpkg -i packages-microsoft-prod.deb
            apt-get update -qq
            apt-get install -y powershell
          fi
          pwsh --version

      - id: jacoco
        uses: .
        with:
          coverage_results_path: tests/fixtures/jacoco-full-coverage.xml
          minimum_coverage: "100"
          fail_below_threshold: "true"
          skip_check_run: "true"
          publish_only_summary: "true"

      - name: Assert missed_lines is zero
        env:
          ACTUAL: ${{ steps.jacoco.outputs.missed_lines }}
        run: |
          echo "missed_lines: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: missed_lines output is empty"
            exit 1
          fi
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected missed_lines=0 for 100% coverage, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: missed_lines=0 as expected for full coverage"

      - name: Assert coverage_percentage is 100
        env:
          ACTUAL: ${{ steps.jacoco.outputs.coverage_percentage }}
        run: |
          echo "coverage_percentage: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: coverage_percentage output is empty"
            exit 1
          fi
          # Strip any trailing % sign if present
          PCT="${ACTUAL//%/}"
          MEETS=$(awk -v pct="$PCT" 'BEGIN { print (pct >= 100) ? "yes" : "no" }')
          if [ "$MEETS" != "yes" ]; then
            echo "FAIL: expected 100% coverage, got $PCT%"
            exit 1
          fi
          echo "PASS: coverage_percentage=$ACTUAL is 100%"

      - name: Assert covered_lines equals total_lines
        env:
          COVERED: ${{ steps.jacoco.outputs.covered_lines }}
          TOTAL: ${{ steps.jacoco.outputs.total_lines }}
        run: |
          echo "covered_lines=$COVERED total_lines=$TOTAL"
          if [ "$COVERED" != "$TOTAL" ]; then
            echo "FAIL: for 100% coverage, covered_lines($COVERED) should equal total_lines($TOTAL)"
            exit 1
          fi
          echo "PASS: covered_lines equals total_lines for 100% coverage"
