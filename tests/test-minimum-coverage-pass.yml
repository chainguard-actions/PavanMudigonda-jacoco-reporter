name: Test minimum coverage - threshold met (pass)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            apt-get update -qq
            apt-get install -y wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            dpkg -i packages-microsoft-prod.deb
            apt-get update -qq
            apt-get install -y powershell
          fi
          pwsh --version

      - id: jacoco
        uses: .
        with:
          coverage_results_path: tests/fixtures/jacoco-coverage.xml
          minimum_coverage: "80"
          fail_below_threshold: "true"
          skip_check_run: "true"
          publish_only_summary: "true"

      - name: Assert coverage_percentage meets threshold
        env:
          ACTUAL: ${{ steps.jacoco.outputs.coverage_percentage }}
        run: |
          echo "coverage_percentage: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: coverage_percentage output is empty"
            exit 1
          fi
          # Strip any trailing % sign if present
          PCT="${ACTUAL//%/}"
          # Use awk for float comparison
          MEETS=$(awk -v pct="$PCT" 'BEGIN { print (pct >= 80) ? "yes" : "no" }')
          if [ "$MEETS" != "yes" ]; then
            echo "FAIL: coverage $PCT% is below minimum 80%"
            exit 1
          fi
          echo "PASS: coverage $PCT% meets minimum 80%"
